<meta charset="utf-8">
<title>Orb Candidates</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root{--bg:#f5f5f2;--card:#e9e9e4;--ink:#141416;--muted:#6c6c72;--line:#d6d6cf;--sans:"Instrument Sans",ui-sans-serif,system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#111113;--card:#1c1c20;--ink:#ececea;--muted:#8f8f96;--line:#2c2c31}}
  :root[data-theme="dark"]{--bg:#111113;--card:#1c1c20;--ink:#ececea;--muted:#8f8f96;--line:#2c2c31}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);padding-inline:clamp(16px,4vw,48px);padding-block:28px 60px}
  .wrap{max-width:1120px;margin:0 auto}
  h1{font-size:20px;font-weight:600;margin:0 0 6px}
  p.lead{margin:0 0 24px;color:var(--muted);max-width:62ch}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
  .card{background:var(--card);border-radius:10px;padding:14px 14px 12px;display:flex;flex-direction:column;align-items:center;gap:6px}
  .card svg{width:150px;height:150px;margin:-10px}
  .card b{font-weight:600;font-size:14px}
  .card small{font-size:12px;color:var(--muted);text-align:center;line-height:1.4}
  .card code{font:11px var(--mono);color:var(--muted)}
</style>
<div class="wrap">
  <h1>Orb candidates</h1>
  <p class="lead">Rendered with the library at rest, same rounding and sizing as the catalog. Each note names the act only that body can do.</p>
  <div class="grid" id="g"></div>
</div>
<script src="mascot.js"></script>
<script>
(() => {
  const C = [
    ['Peanut',   [[-0.42,0,0.6],[0.42,0,0.6]], 'Two lobes at a waist. Acts: split and snap back; quarter roll around the waist.'],
    ['Pinwheel', [[0,0,0.62],[0.62,-0.22,0.34],[0.22,0.62,0.34],[-0.62,0.22,0.34],[-0.22,-0.62,0.34]], 'Petals set off-centre so it reads as turning. Acts: spin up with lag; reverse.'],
    ['Comet',    [[0.18,0,0.78],[-0.62,0.02,0.34],[-0.98,0.04,0.22],[-1.24,0.06,0.13]], 'Core with a fading tail. Acts: streak long during a dash; tail flicker.'],
    ['Pill',     [[0,0,1.05,0.6,0]], 'One long capsule. Acts: seesaw tilt; stretch thin then contract to a circle.'],
    ['Dumbbell', [[-0.62,0,0.44],[0.62,0,0.44],[0,0,0.62,0.14,0]], 'Two ends on a bar. Acts: bar bows and ends dip; eyes hop end to end.'],
    ['Bubble',   [[0,0.05,0.82],[0.72,-0.5,0.26],[-0.8,0.3,0.18],[0.55,0.7,0.14]], 'Small bubbles cling to the edge. Acts: one pops and regrows elsewhere; bubbles merge in.'],
    ['Squiggle', [[-0.6,-0.5,0.42],[0,0,0.42],[0.6,0.5,0.42]], 'Diagonal chain. Acts: an S-wave slithers down; coil into a ring and unwind.'],
    ['Spark',    [[0,0,0.68],[0,-0.78,0.42,0.14,90],[0,0.78,0.42,0.14,90],[-0.78,0,0.42,0.14,0],[0.78,0,0.42,0.14,0],[-0.55,-0.55,0.42,0.14,-45],[0.55,0.55,0.42,0.14,-45],[0.55,-0.55,0.42,0.14,45],[-0.55,0.55,0.42,0.14,45]], 'Core with short spikes. Acts: flash out and retract; twinkle in random order.'],
    ['Splat',    [[0,0.04,0.74],[-0.6,-0.4,0.34],[0.55,-0.5,0.26],[0.68,0.28,0.3],[-0.3,0.72,0.28],[0.18,0.78,0.2]], 'Irregular lobes. Acts: lobes jiggle out of phase; settle flat like a drop on a table.'],
    ['Kite',     [[0,-0.05,0.74],[0,-0.8,0.5,0.28,0],[0,0.85,0.22]], 'Wide top, small tail knob. Acts: tail swings like a pendulum; the top catches a gust and lifts.'],
    ['Twin',     [[0,-0.4,0.62],[0,0.4,0.62]], 'Two stacked equal circles. Acts: the halves counter-rotate; top hops onto the bottom and back.'],
    ['Ring',     [[0,0,0.62],[0.66,0,0.3],[-0.66,0,0.3],[0,0.66,0.3],[0,-0.66,0.3],[0.47,0.47,0.3],[-0.47,-0.47,0.3],[0.47,-0.47,0.3],[-0.47,0.47,0.3]], 'A gear of eight even lobes. Acts: ratchet turn one notch at a time; lobes breathe in a wave.'],
  ];
  const g = document.getElementById('g');
  for (const [name, pieces, note] of C) {
    const card = document.createElement('div'); card.className = 'card';
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    const b = document.createElement('b'); b.textContent = name;
    const sm = document.createElement('small'); sm.textContent = note;
    const code = document.createElement('code'); code.textContent = pieces.length + (pieces.length === 1 ? ' piece' : ' pieces');
    card.append(svg, b, sm, code); g.append(card);
    const dark = document.documentElement.dataset.theme === 'dark' || (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
    const m = new Mascot(svg, { body: pieces, lean: false, color: dark ? '#ECECEA' : '#0a0a0a' }); m.snap(-12, 5); m.render();
  }
})();
</script>
