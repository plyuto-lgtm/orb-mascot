<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>OrbSlider test harness</title>
<style>
  body{margin:0;font:14px/1.5 system-ui,sans-serif;background:#f5f5f2;color:#141416;padding:24px}
  .row{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}
  .box{width:280px;height:280px;background:#ebebe6;border-radius:12px}
  pre{font:12px ui-monospace,monospace;white-space:pre-wrap}
</style>
<p>Dev harness: compiles <code>OrbSlider.tsx</code> in the browser with a stand-in for the <code>framer</code> module. Not part of the component.</p>
<div class="row"><div class="box" id="a"></div><div class="box" id="b" style="width:360px;height:200px"></div></div>
<p><button data-framer-name="Button" style="font:500 14px system-ui;padding:10px 16px;border-radius:10px;border:0;background:#141416;color:#fff">Hover me (layer "Button")</button></p>
<div class="row" id="refs"></div>
<pre id="out"></pre>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script src="../mascot.js"></script>
<script>
(async () => {
  const src = await (await fetch('OrbSlider.tsx?' + Date.now())).text();
  window.sliderSrc = src;
  const framer = { addPropertyControls: (c, p) => { c.__controls = p; }, ControlType: new Proxy({}, { get: (_, k) => k }), RenderTarget: { current: () => 'preview', canvas: 'canvas' } };
  window.loadSlider = (shape) => {
    let code = src;
    if (shape) code = code.replace(/const SHAPE: number\[\]\[\] = [^\n]*/, 'const SHAPE: number[][] = ' + JSON.stringify(shape));
    code += '\nexport const __t = { fillField, contourPath, piecesFor, NO_ACT, G, REST, DEFS, FIT };';
    const js = Babel.transform(code, { filename: 'OrbSlider.tsx', presets: ['typescript', ['react', { runtime: 'classic' }]], plugins: ['transform-modules-commonjs'] }).code;
    const exports = {}; new Function('require', 'exports', 'React', js)(n => n === 'react' ? React : framer, exports, React); return exports;
  };
  const mod = window.loadSlider(); window.Slider = mod.default; window.sliderT = mod.__t;
  const h = React.createElement;
  ReactDOM.createRoot(document.getElementById('a')).render(h(mod.default, { hoverTarget: 'Button' }));
  ReactDOM.createRoot(document.getElementById('b')).render(h(mod.default, { start: 'cloud', autoplay: true, autoplayEvery: 3, align: 'left' }));
  // catalog references at rest
  window.refs = {};
  for (const id of ['bear', 'lemon', 'cloud', 'seacow']) { const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); svg.setAttribute('width', 140); svg.setAttribute('height', 140); document.getElementById('refs').append(svg); const m = new Mascot(svg, { body: id, lean: false }); m.snap(0, 0); m.render(); svg.setAttribute('viewBox', '-4 -8 208 208'); window.refs[id] = m; }
  document.getElementById('out').textContent = 'loaded: ' + Object.keys(mod.default.__controls).length + ' property controls';
})().catch(e => { document.getElementById('out').textContent = 'ERROR: ' + e.message + '\n' + e.stack; });
</script>
